<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>팝 팝! 무작위 룰렛 추첨기</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Fredoka & Black Han Sans for Pop art style -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Fredoka:wght@600;700;900&family=Jua&display=swap" rel="stylesheet">
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        body {
            font-family: 'Jua', 'Fredoka', sans-serif;
            background-color: #fde047; /* Bright Pop Yellow */
            background-image: 
                radial-gradient(#facc15 20%, transparent 20%),
                radial-gradient(#facc15 20%, transparent 20%);
            background-size: 30px 30px;
            background-position: 0 0, 15px 15px;
        }

        /* Pop Neo-brutalism Shadows & Borders */
        .pop-card {
            background-color: #ffffff;
            border: 4px solid #000000;
            box-shadow: 8px 8px 0px 0px #000000;
            border-radius: 24px;
        }

        .pop-btn {
            border: 4px solid #000000;
            box-shadow: 6px 6px 0px 0px #000000;
            transition: all 0.1s ease;
        }
        .pop-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 8px 8px 0px 0px #000000;
        }
        .pop-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0px 0px #000000;
        }

        .pop-input {
            border: 3px solid #000000;
            box-shadow: 3px 3px 0px 0px #000000;
        }

        /* Number Display Frame */
        .display-box {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 6px solid #000000;
            box-shadow: 10px 10px 0px 0px #000000;
        }

        /* Blinking Lights */
        .led-light {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            border: 2px solid #000;
            display: inline-block;
        }
        .led-yellow { background-color: #facc15; }
        .led-pink { background-color: #ec4899; }
        .led-cyan { background-color: #06b6d4; }

        @keyframes ledBlink {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.85); }
        }
        .running .led-light {
            animation: ledBlink 0.3s infinite alternate;
        }
        .running .led-light:nth-child(2n) {
            animation-delay: 0.15s;
        }

        /* Stop Zoom Animation */
        @keyframes popStopZoom {
            0% {
                transform: scale(0.4) rotate(-10deg);
                opacity: 0.5;
            }
            60% {
                transform: scale(1.35) rotate(5deg);
                opacity: 1;
            }
            80% {
                transform: scale(0.95) rotate(-2deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
            }
        }
        .stop-animation {
            animation: popStopZoom 0.65s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Fast Blur Motion Effect while running */
        .blur-motion {
            filter: blur(2px);
            transform: scale(1.05);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #fef08a;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #000000;
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 md:p-6 text-slate-900 selection:bg-pink-400 selection:text-white">

    <!-- Header -->
    <header class="text-center my-4">
        <div class="inline-block bg-white border-4 border-black px-6 py-2 rounded-full shadow-[6px_6px_0px_0px_#000000] transform -rotate-1 hover:rotate-0 transition-transform">
            <h1 class="text-3xl md:text-5xl font-black text-amber-500 tracking-wider flex items-center gap-3" style="font-family: 'Black Han Sans', sans-serif;">
                <i class="fa-solid fa-dice-five text-pink-500"></i>
                <span>LUCKY ROULETTE</span>
                <i class="fa-solid fa-star text-cyan-400"></i>
            </h1>
        </div>
        <p class="text-black font-bold text-base md:text-lg mt-3 bg-yellow-300 inline-block px-4 py-1 rounded-full border-2 border-black">
            ⚡ 행운의 번호를 뽑아보세요!
        </p>
    </header>

    <!-- Main Center Area -->
    <main class="w-full max-w-xl flex flex-col items-center my-auto gap-6">

        <!-- Display Screen Panel -->
        <div id="roulettePanel" class="display-box w-full p-6 md:p-8 rounded-3xl relative flex flex-col items-center justify-center min-h-[260px] md:min-h-[320px] transition-all">
            
            <!-- Top LED Decor Strip -->
            <div class="absolute top-3 left-0 right-0 flex justify-around px-6">
                <span class="led-light led-pink"></span>
                <span class="led-light led-yellow"></span>
                <span class="led-light led-cyan"></span>
                <span class="led-light led-pink"></span>
                <span class="led-light led-yellow"></span>
                <span class="led-light led-cyan"></span>
                <span class="led-light led-pink"></span>
                <span class="led-light led-yellow"></span>
            </div>

            <!-- Number Display Screen -->
            <div class="my-auto py-4 text-center w-full overflow-hidden flex items-center justify-center">
                <span id="numberDisplay" class="text-7xl md:text-9xl font-black text-amber-300 drop-shadow-[0_6px_0_#000] tracking-wider select-none">
                    ?
                </span>
            </div>

            <!-- Bottom LED Decor Strip -->
            <div class="absolute bottom-3 left-0 right-0 flex justify-around px-6">
                <span class="led-light led-cyan"></span>
                <span class="led-light led-yellow"></span>
                <span class="led-light led-pink"></span>
                <span class="led-light led-cyan"></span>
                <span class="led-light led-yellow"></span>
                <span class="led-light led-pink"></span>
                <span class="led-light led-cyan"></span>
                <span class="led-light led-yellow"></span>
            </div>

            <!-- Status Tag -->
            <div id="statusBadge" class="absolute -top-4 bg-pink-500 text-white font-black px-5 py-1 text-sm md:text-base rounded-full border-2 border-black shadow-[3px_3px_0px_0px_#000]">
                READY TO SPIN!
            </div>
        </div>

        <!-- Controls & Range Config Card -->
        <div class="pop-card w-full p-5 md:p-6 flex flex-col gap-5">
            
            <!-- Range Inputs -->
            <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 items-center">
                <div class="flex flex-col gap-1">
                    <label for="minNum" class="text-xs font-black text-gray-700">최소 번호 (Min)</label>
                    <input type="number" id="minNum" value="1" min="0" max="99999" class="pop-input px-3 py-2 rounded-xl text-center font-black text-lg focus:outline-none focus:bg-yellow-100">
                </div>
                <div class="flex flex-col gap-1">
                    <label for="maxNum" class="text-xs font-black text-gray-700">최대 번호 (Max)</label>
                    <input type="number" id="maxNum" value="100" min="1" max="99999" class="pop-input px-3 py-2 rounded-xl text-center font-black text-lg focus:outline-none focus:bg-yellow-100">
                </div>
                <div class="col-span-2 sm:col-span-1 flex items-center sm:justify-center pt-2 sm:pt-4">
                    <label class="flex items-center gap-2 cursor-pointer select-none">
                        <input type="checkbox" id="noRepeat" class="w-5 h-5 accent-pink-500 border-2 border-black rounded cursor-pointer">
                        <span class="text-sm font-black">중복 제외</span>
                    </label>
                </div>
            </div>

            <!-- Buttons Row -->
            <div class="flex gap-4 w-full">
                <!-- START BUTTON -->
                <button id="startBtn" onclick="startSpin()" class="pop-btn flex-1 bg-emerald-400 hover:bg-emerald-300 text-black font-black text-xl md:text-2xl py-4 rounded-2xl flex items-center justify-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-play"></i> START
                </button>

                <!-- STOP BUTTON -->
                <button id="stopBtn" onclick="stopSpin()" disabled class="pop-btn flex-1 bg-rose-500 hover:bg-rose-400 text-white font-black text-xl md:text-2xl py-4 rounded-2xl flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
                    <i class="fa-solid fa-square"></i> STOP
                </button>
            </div>
        </div>

        <!-- History Drawer / Accordion -->
        <div class="pop-card w-full p-4 flex flex-col gap-3">
            <div class="flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-amber-500 text-lg"></i>
                    <h3 class="font-black text-base md:text-lg">당첨 기록 (<span id="historyCount">0</span>)</h3>
                </div>
                <button onclick="clearHistory()" class="text-xs bg-gray-200 hover:bg-gray-300 border-2 border-black font-black px-3 py-1 rounded-lg">
                    <i class="fa-solid fa-trash-can"></i> 초기화
                </button>
            </div>
            
            <!-- History Badges Container -->
            <div id="historyList" class="flex flex-wrap gap-2 max-h-32 overflow-y-auto p-2 bg-yellow-50 rounded-xl border-2 border-dashed border-black min-h-[50px] items-center">
                <span id="emptyHistoryText" class="text-gray-400 text-sm font-bold w-full text-center">추첨된 번호가 여기에 표시됩니다!</span>
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="text-center my-2 text-xs md:text-sm font-black text-slate-800">
        POP LUCKY ROULETTE &copy; 2026 | Bright & Fun Random Picker
    </footer>

    <script>
        // App State
        let isRunning = false;
        let timerId = null;
        let currentNum = 0;
        let availableNumbers = [];
        let drawnHistory = [];
        
        // Sound Effects using Web Audio API
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        // Tick Sound (Spinning)
        function playTickSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(400 + Math.random() * 200, audioCtx.currentTime);
                
                gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.04);

                osc.connect(gain);
                gain.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.04);
            } catch (e) {
                // Audio fallback silence
            }
        }

        // Fanfare Sound (Stop/Win)
        function playFanfareSound() {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
            notes.forEach((freq, idx) => {
                setTimeout(() => {
                    try {
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                        
                        gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);

                        osc.connect(gain);
                        gain.connect(audioCtx.destination);

                        osc.start();
                        osc.stop(audioCtx.currentTime + 0.3);
                    } catch (e) {}
                }, idx * 90);
            });
        }

        // DOM Elements
        const minInput = document.getElementById('minNum');
        const maxInput = document.getElementById('maxNum');
        const noRepeatCheckbox = document.getElementById('noRepeat');
        const display = document.getElementById('numberDisplay');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');
        const statusBadge = document.getElementById('statusBadge');
        const roulettePanel = document.getElementById('roulettePanel');
        const historyList = document.getElementById('historyList');
        const historyCount = document.getElementById('historyCount');
        const emptyHistoryText = document.getElementById('emptyHistoryText');

        // Prepare pool of numbers
        function getValidRange() {
            let min = parseInt(minInput.value, 10);
            let max = parseInt(maxInput.value, 10);

            if (isNaN(min)) min = 1;
            if (isNaN(max)) max = 100;

            if (min > max) {
                const temp = min;
                min = max;
                max = temp;
                minInput.value = min;
                maxInput.value = max;
            }

            return { min, max };
        }

        // Start Roulette Spin
        function startSpin() {
            if (isRunning) return;

            const { min, max } = getValidRange();
            const noRepeat = noRepeatCheckbox.checked;

            // Prepare list of numbers
            let pool = [];
            for (let i = min; i <= max; i++) {
                if (!noRepeat || !drawnHistory.includes(i)) {
                    pool.push(i);
                }
            }

            if (pool.length === 0) {
                alert('설정한 범위 내에서 이미 모든 번호가 뽑혔습니다! 초기화하거나 범위를 변경하세요.');
                return;
            }

            availableNumbers = pool;
            isRunning = true;

            // UI State updates
            startBtn.disabled = true;
            startBtn.classList.add('opacity-50', 'cursor-not-allowed');
            
            stopBtn.disabled = false;
            stopBtn.classList.remove('opacity-50', 'cursor-not-allowed');

            minInput.disabled = true;
            maxInput.disabled = true;
            noRepeatCheckbox.disabled = true;

            statusBadge.innerText = 'SPINNING...';
            statusBadge.className = 'absolute -top-4 bg-yellow-400 text-black font-black px-5 py-1 text-sm md:text-base rounded-full border-2 border-black shadow-[3px_3px_0px_0px_#000] animate-bounce';

            roulettePanel.classList.add('running');
            display.classList.remove('stop-animation');
            display.classList.add('blur-motion');

            // Rapid Number Switch Timer (High speed)
            let speed = 30; // ms
            function runLoop() {
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                currentNum = availableNumbers[randomIndex];
                display.innerText = currentNum;
                playTickSound();

                if (isRunning) {
                    timerId = setTimeout(runLoop, speed);
                }
            }
            runLoop();
        }

        // Stop Roulette Spin
        function stopSpin() {
            if (!isRunning) return;

            clearTimeout(timerId);

            // Gradual slowdown effect for thrill
            let slowSteps = 0;
            let currentDelay = 50;

            function slowDownLoop() {
                slowSteps++;
                const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                currentNum = availableNumbers[randomIndex];
                display.innerText = currentNum;
                playTickSound();

                if (slowSteps < 8) {
                    currentDelay += 35;
                    setTimeout(slowDownLoop, currentDelay);
                } else {
                    // Final Stop Phase
                    finishSpin();
                }
            }

            slowDownLoop();
        }

        // Finalize Winning Number
        function finishSpin() {
            isRunning = false;

            // UI State updates
            startBtn.disabled = false;
            startBtn.classList.remove('opacity-50', 'cursor-not-allowed');
            
            stopBtn.disabled = true;
            stopBtn.classList.add('opacity-50', 'cursor-not-allowed');

            minInput.disabled = false;
            maxInput.disabled = false;
            noRepeatCheckbox.disabled = false;

            roulettePanel.classList.remove('running');
            display.classList.remove('blur-motion');

            // Apply Stop Pop-Zoom Animation
            void display.offsetWidth; // Trigger Reflow
            display.classList.add('stop-animation');

            statusBadge.innerText = 'WINNER!';
            statusBadge.className = 'absolute -top-4 bg-emerald-400 text-black font-black px-5 py-1 text-sm md:text-base rounded-full border-2 border-black shadow-[3px_3px_0px_0px_#000]';

            // Play Fanfare & Trigger Confetti
            playFanfareSound();
            fireConfetti();

            // Record History
            addHistory(currentNum);
        }

        // Trigger Confetti Celebration
        function fireConfetti() {
            const count = 200;
            const defaults = {
                origin: { y: 0.6 }
            };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, {
                spread: 26,
                startVelocity: 55,
                colors: ['#facc15', '#ec4899', '#06b6d4']
            });
            fire(0.2, {
                spread: 60,
                colors: ['#ffffff', '#10b981', '#f43f5e']
            });
            fire(0.35, {
                spread: 100,
                decay: 0.91,
                scalar: 0.8
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 25,
                decay: 0.92,
                colors: ['#facc15', '#3b82f6', '#ec4899']
            });
            fire(0.1, {
                spread: 120,
                startVelocity: 45,
            });
        }

        // Add Winner Number to History
        function addHistory(num) {
            drawnHistory.unshift(num);

            if (emptyHistoryText) {
                emptyHistoryText.style.display = 'none';
            }

            historyCount.innerText = drawnHistory.length;

            const badge = document.createElement('div');
            badge.className = 'pop-btn bg-pink-400 text-black font-black text-base px-3 py-1 rounded-xl flex items-center gap-1 animate-bounce';
            badge.innerHTML = `<i class="fa-solid fa-crown text-yellow-200 text-xs"></i> ${num}`;

            // Remove bounce animation after 1 sec
            setTimeout(() => {
                badge.classList.remove('animate-bounce');
            }, 1000);

            historyList.insertBefore(badge, historyList.firstChild);
        }

        // Clear History
        function clearHistory() {
            drawnHistory = [];
            historyCount.innerText = '0';
            historyList.innerHTML = '<span id="emptyHistoryText" class="text-gray-400 text-sm font-bold w-full text-center">추첨된 번호가 여기에 표시됩니다!</span>';
        }
    </script>
</body>
</html>
